<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Calculator</title>
  <!-- Internal CSS -->
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #5f86c0;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      background: #ce5757;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(43, 37, 131, 0.34);
      width: 300px;
      text-align: center;
    }

    h1 {
      margin-bottom: 20px;
      color: #4d2020;
    }

    input[type="text"], select {
      width: 90%;
      padding: 10px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    button {
      background: #007BFF;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 5px;
      cursor: pointer;
      margin-top: 10px;
    }

    button:hover {
      background: #0056b3;
    }

    .solution {
      margin-top: 20px;
      font-weight: bold;
      color: #28a745;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Calculator</h1>
    <form method="POST">
      {% csrf_token %}
      <input type="text" name="a" placeholder="Enter first number" required>
      <input type="text" name="b" placeholder="Enter second number" required>
      <select name="opr" required>
        <option value="+">+</option>
        <option value="-">-</option>
        <option value="*">*</option>
        <option value="**">**</option>
      </select>
      <button type="submit">Calculate</button>
    </form>
    <div class="solution">
      Result: {{ solution }}
    </div>
  </div>
</body>
</html>
